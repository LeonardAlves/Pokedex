version: '3.8'

services:

  mongodb:
    image: mongo
    container_name: pokedex-db
    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 123456

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: